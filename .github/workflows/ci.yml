name: CI

# Runs on every push to main and on pull requests. No cron / no polling.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Engine tests + Swift build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Engine regression tests (fidelity invariants)
        run: python tests/regression.py

      - name: Swift build (macOS app compiles)
        run: swift build
